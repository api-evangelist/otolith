aid: otolith
name: Otolith
description: 'Otolith Labs, Inc. (trading as Otolith) is a privately held, clinical-stage medical device
  company headquartered at 200 Massachusetts Ave NW in Washington, D.C., founded in 2015 by Sam Owen and
  developing a non-invasive wearable headband — the OtoBand — that applies calibrated mechanical vibration
  to the vestibular system, a technique the company calls non-invasive Vestibular Resonance Therapy (nVRT)
  or vestibular masking, to reduce the symptoms of chronic vertigo and vestibular migraine without surgery,
  medication, or patient-specific calibration. The device holds an FDA Breakthrough Device designation, has
  been evaluated in clinical work spanning 600+ subjects, and is being studied for cybersickness in virtual
  reality. Otolith Labs is backed by Morningside Ventures, Mark Cuban Companies and a group of ENT physician
  investors. It is a physical medical device manufacturer: it publishes no public API, developer portal,
  SDK, or machine-readable specification, and its only web surface is a WordPress marketing, investor and
  clinical-trial site.'
